<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>솔라티 좌석 실시간 예약</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif; }
    body { background-color: #f1f3f5; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { background: #fff; width: 100%; max-width: 440px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; margin-top: 0; color: #111; font-size: 20px; font-weight: 800; }
    
    .notice-box { background: #f8f9fa; border: 1px solid #dee2e6; border-left: 4px solid #0066ff; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; color: #333; }
    .notice-box b { color: #0066ff; }
    
    .status-bar { text-align: center; font-weight: 700; margin-bottom: 14px; color: #e03131; font-size: 15px; }

    /* 차량 좌석 배치도 */
    .bus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .seat { 
      border: 2px solid #ced4da; 
      border-radius: 10px; 
      padding: 14px 4px; 
      text-align: center; 
      font-size: 13px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      background: #ffffff;
      color: #333;
      user-select: none;
    }
    .seat:hover:not(.occupied):not(.driver):not(.door) {
      border-color: #339af0;
      background-color: #f8f9fa;
    }
    
    /* 운전석 및 문 */
    .seat.driver { background: #343a40; color: #fff; border-color: #343a40; cursor: not-allowed; }
    .seat.door { background: #e9ecef; border-color: #dee2e6; cursor: not-allowed; color: #868e96; display: flex; align-items: center; justify-content: center; }
    .seat.empty-space { border: none; background: transparent; cursor: default; }

    /* 내가 선택 중인 좌석 (파란색) */
    .seat.selected { 
      background-color: #e7f5ff !important; 
      border-color: #1c7ed6 !important; 
      color: #1864ab !important; 
      box-shadow: 0 0 0 2px rgba(28, 126, 214, 0.2);
    }

    /* 다른 사람이 예약 완료한 좌석 (빨간색 & 클릭 불가) */
    .seat.occupied { 
      background-color: #ff4d4f !important; 
      border-color: #d9363e !important; 
      color: #ffffff !important; 
      cursor: not-allowed !important; 
      opacity: 0.95;
      pointer-events: none !important; /* 클릭 아예 차단 */
    }
    .seat.occupied span { color: #ffffff !important; font-weight: 800; display: block; margin-top: 3px; font-size: 12px; }

    /* 입력 폼 */
    .form-group { margin-bottom: 12px; }
    label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; color: #495057; }
    input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #dee2e6; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    input[type="text"]:focus { border-color: #339af0; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 16px 0; font-size: 13px; font-weight: 600; color: #333; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

    button { width: 100%; background: #0066ff; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0052cc; }
    button:disabled { background: #adb5bd; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚐 솔라티 좌석 예약 (11인 제한)</h2>
  
  <div class="notice-box">
    📢 <b>예약 안내</b><br>
    • 노쇼 방지 예약금: <b>5,000원</b><br>
    • 입금 계좌: <b>카카오뱅크 1234-56-7890123 (예금주: 홍길동)</b><br>
    • 빈 좌석 클릭 ➔ 이름 입력 ➔ 입금 체크 ➔ 예약 완료
  </div>

  <div class="status-bar" id="seatStatus">좌석 현황 불러오는 중...</div>

  <!-- 차량 레이아웃 -->
  <div class="bus-grid" id="busLayout">
    <!-- 운전석 & F1 -->
    <div class="seat driver">영훈<br>(운전석)</div>
    <div class="seat empty-space"></div>
    <div class="seat" data-id="F1" onclick="selectSeat('F1')">F1 조수석<br><span id="name-F1">()</span></div>

    <!-- 통로 & 문 -->
    <div class="seat empty-space"></div>
    <div class="seat empty-space"></div>
    <div class="seat door">문</div>

    <!-- A열 -->
    <div class="seat" data-id="A1" onclick="selectSeat('A1')">A1<br><span id="name-A1">()</span></div>
    <div class="seat" data-id="A2" onclick="selectSeat('A2')">A2<br><span id="name-A2">()</span></div>
    <div class="seat" data-id="A3" onclick="selectSeat('A3')">A3<br><span id="name-A3">()</span></div>

    <!-- B열 -->
    <div class="seat" data-id="B1" onclick="selectSeat('B1')">B1<br><span id="name-B1">()</span></div>
    <div class="seat" data-id="B2" onclick="selectSeat('B2')">B2<br><span id="name-B2">()</span></div>
    <div class="seat" data-id="B3" onclick="selectSeat('B3')">B3<br><span id="name-B3">()</span></div>

    <!-- C열 -->
    <div class="seat" data-id="C1" onclick="selectSeat('C1')">C1<br><span id="name-C1">()</span></div>
    <div class="seat" data-id="C2" onclick="selectSeat('C2')">C2<br><span id="name-C2">()</span></div>
    <div class="seat" data-id="C3" onclick="selectSeat('C3')">C3<br><span id="name-C3">()</span></div>

    <!-- D열 -->
    <div class="seat" data-id="D1" onclick="selectSeat('D1')">D1<br><span id="name-D1">()</span></div>
    <div class="seat" data-id="D2" onclick="selectSeat('D2')">D2<br><span id="name-D2">()</span></div>
    <div class="seat" data-id="D3" onclick="selectSeat('D3')">D3<br><span id="name-D3">()</span></div>
  </div>

  <!-- 예약 폼 -->
  <div class="form-group">
    <label>선택한 좌석</label>
    <input type="text" id="selectedSeatDisplay" placeholder="위 좌석표에서 자리를 선택하세요" readonly>
  </div>

  <div class="form-group">
    <label>예약자 성함</label>
    <input type="text" id="userName" placeholder="이름을 입력하세요">
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="depositCheck">
    <label for="depositCheck">5,000원 입금을 완료했습니다 (필수)</label>
  </div>

  <button id="submitBtn" onclick="submitReservation()">예약 완료하기</button>
</div>

<!-- Firebase 연동 스크립트 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAz_9tfTil9mX-I2D04OayoZLqN7CWXySw",
    authDomain: "trip-autumn-ymjs.firebaseapp.com",
    databaseURL: "https://trip-autumn-ymjs-default-rtdb.firebaseio.com",
    projectId: "trip-autumn-ymjs",
    storageBucket: "trip-autumn-ymjs.firebasestorage.app",
    messagingSenderId: "147671125673",
    appId: "1:147671125673:web:5a2fb8c5f758807ad4a3b8",
    measurementId: "G-Q8DLF56611"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const seatsRef = ref(db, 'seats');

  let currentSeatsData = {};
  let currentSelectedSeat = null;

  // 실시간 동기화 리스너
  onValue(seatsRef, (snapshot) => {
    currentSeatsData = snapshot.val() || {};
    let bookedCount = 0;

    const allSeatIds = ['F1', 'A1', 'A2', 'A3', 'B1', 'B2', 'B3', 'C1', 'C2', 'C3', 'D1', 'D2', 'D3'];
    
    allSeatIds.forEach(id => {
      const el = document.querySelector(`[data-id="${id}"]`);
      const nameSpan = document.getElementById(`name-${id}`);
      if (!el) return;

      if (currentSeatsData[id]) {
        bookedCount++;
        el.classList.add('occupied');
        el.classList.remove('selected');
        nameSpan.textContent = `(${currentSeatsData[id]})`;
        
        // 만약 내가 고르고 있던 자리를 남이 먼저 낚아채면 선택 취소
        if (currentSelectedSeat === id) {
          currentSelectedSeat = null;
          document.getElementById('selectedSeatDisplay').value = '';
          alert(`${id} 좌석을 다른 사람이 먼저 예약 완료했습니다.`);
        }
      } else {
        el.classList.remove('occupied');
        nameSpan.textContent = `()`;
      }
    });

    const remaining = 11 - bookedCount;
    const statusEl = document.getElementById('seatStatus');
    if (remaining <= 0) {
      statusEl.textContent = "🚫 모든 좌석 예약이 마감되었습니다 (0 / 11)";
      statusEl.style.color = "#e03131";
    } else {
      statusEl.textContent = `✅ 남은 좌석: ${remaining} / 11`;
      statusEl.style.color = "#2f9e44";
    }
  });

  // 좌석 클릭 함수
  window.selectSeat = function(seatId) {
    // 1. 이미 예약된 자리인지 체크
    if (currentSeatsData[seatId]) {
      alert("이미 예약된 좌석입니다. 다른 자리를 선택해주세요.");
      return;
    }

    // 2. 다른 선택 효과 초기화 후 현재 자리 선택
    document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
    const target = document.querySelector(`[data-id="${seatId}"]`);
    if (target) {
      target.classList.add('selected');
    }

    currentSelectedSeat = seatId;
    document.getElementById('selectedSeatDisplay').value = seatId;
  };

  // 예약 버튼 클릭 함수
  window.submitReservation = function() {
    const name = document.getElementById('userName').value.trim();
    const depositCheck = document.getElementById('depositCheck').checked;

    if (!currentSelectedSeat) {
      alert("원하시는 좌석을 먼저 클릭해주세요.");
      return;
    }
    if (!name) {
      alert("예약자 성함을 입력해주세요.");
      document.getElementById('userName').focus();
      return;
    }
    if (!depositCheck) {
      alert("입금 확인 체크박스에 체크해주세요.");
      return;
    }
    if (currentSeatsData[currentSelectedSeat]) {
      alert("방금 다른 사람이 먼저 예약했습니다! 다른 자리를 골라주세요.");
      return;
    }

    // Firebase에 좌석별 예약자 이름 저장
    set(ref(db, `seats/${currentSelectedSeat}`), name)
      .then(() => {
        alert(`🎉 ${name}님, [${currentSelectedSeat}] 좌석 예약이 정상 완료되었습니다!`);
        document.getElementById('userName').value = '';
        document.getElementById('depositCheck').checked = false;
        document.getElementById('selectedSeatDisplay').value = '';
        currentSelectedSeat = null;
      })
      .catch((err) => {
        alert("예약 저장 실패: Firebase 규칙 설정을 확인해주세요.\n" + err.message);
      });
  };
</script>

</body>
</html>
